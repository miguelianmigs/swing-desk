name: swing-scan
on:
  schedule:
    # 10:30 AM and 3:30 PM Eastern, Mon-Fri. Daylight saving is handled automatically.
    - cron: "30 10,15 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python scanner.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save results to the dashboard
        run: |
          git config user.name "swing-bot"
          git config user.email "swing-bot@users.noreply.github.com"
          git add docs/data.json
          git commit -m "Scan $(date -u +%Y-%m-%dT%H:%M)" || echo "nothing new"
          git push
